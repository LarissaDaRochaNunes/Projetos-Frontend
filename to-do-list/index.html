<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>Minhas Tarefas do Dia</h1>

            <form id="taskForm" class="input-group">
                <input id="taskInput" type="text" placeholder="Digite uma nova tarefa..." required>
                <button type="submit" id="addButton">Adicionar +</button>
            </form>
        </header>

        <section class="tasks-section">
            <p id="taskCounter" class="task-counter">0 tarefas ativas</p>

            <ul id="taskList" class="task-list">

            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
